name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ODAC v') || github.event_name == 'workflow_dispatch'"
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node here is CI tooling for semantic-release only — the project itself
      # is pure Go (the release version lives in internal/sysinfo/sysinfo.go
      # and is bumped by @semantic-release/exec, see .releaserc.js).
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # No package.json in the repo: install semantic-release and the
      # non-bundled plugins directly into the workspace so plugin resolution
      # from .releaserc.js works. (commit-analyzer / release-notes-generator /
      # github ship with semantic-release itself.)
      - name: Install semantic-release
        run: >
          npm install --no-save
          semantic-release@^24
          @semantic-release/changelog@^6
          @semantic-release/exec@^7
          @semantic-release/git@^10
          conventional-changelog-conventionalcommits@^9

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # .release-version is written by the exec plugin's prepareCmd only when a
      # release was actually cut; everything below is skipped otherwise.
      - name: Get version
        id: version
        run: |
          if [ -f .release-version ]; then
            echo "version=$(cat .release-version)" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.version.outputs.version != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.version != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.version.outputs.version != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.version.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        if: steps.version.outputs.version != ''
        uses: docker/metadata-action@v5
        with:
          images: |
            odacrun/odac
            ghcr.io/odac-run/odac
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.version.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-dev:
    name: Sync release into dev
    needs: release
    if: needs.release.outputs.version != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: sync-dev
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          message="chore(release): sync ${VERSION:+v$VERSION from }main into dev"

          # Retried because dev can move between the fetch and the push.
          for attempt in 1 2 3; do
            git fetch origin main dev
            git checkout -B dev origin/dev

            if git merge-base --is-ancestor origin/main origin/dev; then
              echo "dev already contains main."
              exit 0
            fi

            if ! git merge --no-edit -m "$message" origin/main; then
              git merge --abort
              if [ -z "$(gh pr list --base dev --head main --state open --json number --jq '.[].number')" ]; then
                gh pr create --base dev --head main --title "$message" \
                  --body "Merging main into dev conflicted. Resolve it here so dev builds report the released version."
              fi
              echo "::error::main does not merge cleanly into dev; a pull request was opened."
              exit 1
            fi

            if git push origin dev; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying."
            sleep 5
          done

          echo "::error::Could not push the sync to dev after 3 attempts."
          exit 1
