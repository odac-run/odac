name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ODAC v') || github.event_name == 'workflow_dispatch'"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node here is CI tooling for semantic-release only — the project itself
      # is pure Go (the release version lives in internal/sysinfo/sysinfo.go
      # and is bumped by @semantic-release/exec, see .releaserc.js).
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # No package.json in the repo: install semantic-release and the
      # non-bundled plugins directly into the workspace so plugin resolution
      # from .releaserc.js works. (commit-analyzer / release-notes-generator /
      # github ship with semantic-release itself.)
      - name: Install semantic-release
        run: >
          npm install --no-save
          semantic-release@^24
          @semantic-release/changelog@^6
          @semantic-release/exec@^7
          @semantic-release/git@^10
          conventional-changelog-conventionalcommits@^9

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # .release-version is written by the exec plugin's prepareCmd only when a
      # release was actually cut; everything below is skipped otherwise.
      - name: Get version
        id: version
        run: |
          if [ -f .release-version ]; then
            echo "version=$(cat .release-version)" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Actions
        if: steps.version.outputs.version != ''
        uses: actions/checkout@v5
        with:
          repository: odac-run/actions
          token: ${{ secrets.GH_PAT }}
          path: .github/odac-actions
          ref: main
          persist-credentials: false

      - name: Generate Release Notes
        id: ai_notes
        if: steps.version.outputs.version != ''
        uses: ./.github/odac-actions/actions/release-notes
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          michelangelo: ${{ secrets.MICHELANGELO }}
          version: ${{ steps.version.outputs.version }}
        timeout-minutes: 15
        continue-on-error: true

      - name: Cleanup Actions
        if: always()
        run: rm -rf .github/odac-actions

      - name: Update Release
        uses: softprops/action-gh-release@v2
        if: steps.ai_notes.outcome == 'success' && steps.version.outputs.version != ''
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTE.md
          draft: false
          prerelease: false

      - name: Set up QEMU
        if: steps.version.outputs.version != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.version != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.version.outputs.version != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.version.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        if: steps.version.outputs.version != ''
        uses: docker/metadata-action@v5
        with:
          images: |
            odacrun/odac
            ghcr.io/odac-run/odac
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.version.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
